# =====================================================================
# L'INTERFACE D'ÉDITION DE SIMON
#
# Ce fichier décrit les formulaires qu'il voit. Chaque champ pointe sur
# une valeur réelle du site : ce qu'il tape ici sort à l'écran.
#
# CE QU'IL PEUT CHANGER : ses films, ses mondes, ses reels, ses clients,
# son histoire, ses coordonnées.
# CE QU'IL NE PEUT PAS : la charpente, la mise en page, les couleurs.
# Ce n'est pas de la méfiance, c'est du service : un site qu'on peut
# dérégler d'un clic n'est plus livrable.
# =====================================================================

# LA CONNEXION, PAR DECAPBRIDGE.
# Netlify Identity a été déprécié en février 2025 et Git Gateway l'est
# aussi. Sans remplaçant, Decap obligerait Simon à ouvrir un compte
# GitHub — hors de question. DecapBridge fait le pont : Simon reçoit une
# invitation par mail et ne voit jamais le dépôt.
#
# CE BLOC EST CELUI QUE DECAPBRIDGE FOURNIT, MOT POUR MOT. Ne pas le
# réécrire de mémoire : l'authentification est en PKCE, les clés ne sont
# pas celles d'un git-gateway classique.
backend:
  name: git-gateway
  repo: matissesolitude-pixel/simon-vergely
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/48464eb0-e724-4d4a-a775-255871bde32e/pkce
  auth_token_endpoint: /sites/48464eb0-e724-4d4a-a775-255871bde32e/token
  gateway_url: https://gateway.decapbridge.com

  # Qui a fait quoi : chaque modification est signée du nom de son auteur.
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Les images déposées par Simon atterrissent avec celles du site.
media_folder: site/assets/img
public_folder: /assets/img

# Il voit ses modifications avant de publier, sur une adresse temporaire.
publish_mode: editorial_workflow

locale: fr
site_url: https://resilient-cuchufli-a778a1.netlify.app
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

collections:
  # -------------------------------------------------------------------
  - name: coordonnees
    label: 📇  Mail et téléphone  ·  bas de page
    files:
      - name: contact
        label: Mail, téléphone, Instagram
        file: donnees/contact.json
        description: >
          OÙ ÇA SORT : en bas de chacune des six pages, et derrière les
          boutons « Écrire un mail », « Envoyer un SMS » et « Appeler ».
          Le volet de droite vous montre le pied de page tel qu'il sera.
        fields:
          - { name: mail, label: Adresse mail, widget: string,
              hint: "Celle qui reçoit les demandes de projet." }
          - { name: tel, label: Téléphone (format international), widget: string,
              pattern: ['^\+[0-9]{8,15}$',
                        "Commencez par + et l'indicatif, sans espace. Exemple : +33769051349"],
              hint: "Sert au bouton Appeler et au bouton SMS. Sans espace." }
          - { name: tel_affiche, label: Téléphone tel qu'on le lit, widget: string,
              hint: "La version lisible affichée à l'écran. Exemple : 07 69 05 13 49" }
          - { name: instagram, label: Compte Instagram, widget: string,
              hint: "Sans l'arobase. Exemple : simonvergely" }

  # -------------------------------------------------------------------
  - name: travaux
    label: 🖼  Films et mondes  ·  accueil + page Travail
    files:
      - name: travaux
        label: Les films et les mondes déformés
        file: donnees/travaux.json
        description: >
          DEUX ENDROITS DIFFÉRENTS, ne les mélangez pas.
          Les FILMS vont sur la page « Le travail », en paysage.
          Les MONDES DÉFORMÉS vont sur la page d'accueil, en portrait, sous
          les vidéos. Le volet de droite montre les deux, dans l'ordre du
          site. Une image n'apparaît jamais à deux endroits.
        fields:
          - name: films
            label: Les films
            widget: object
            fields:
              - { name: titre, label: Titre de la section, widget: string }
              - { name: titre_en, label: Titre en anglais, widget: string }
              - { name: chapeau, label: Texte d'introduction, widget: text }
              - { name: chapeau_en, label: Texte d'introduction en anglais, widget: text }
              - name: liste
                label: Les films
                label_singular: un film
                widget: list
                summary: "{{fields.vu}}"
                fields:
                  - { name: f, label: Image, widget: image,
                      hint: "PAGE TRAVAIL, en paysage. Recadrée en 16/9 — ce qui dépasse en haut et en bas est coupé." }
                  - { name: vu, label: Ce qu'on voit, widget: string,
                      hint: "Décrivez l'image en quelques mots. C'est la légende." }
                  - { name: vu_en, label: Ce qu'on voit, en anglais, widget: string }
          - name: mondes
            label: Les mondes déformés
            widget: object
            fields:
              - { name: titre, label: Titre de la section, widget: string }
              - { name: titre_en, label: Titre en anglais, widget: string }
              - { name: chapeau, label: Texte d'introduction, widget: text }
              - { name: chapeau_en, label: Texte d'introduction en anglais, widget: text }
              - name: liste
                label: Les mondes
                label_singular: un monde
                widget: list
                summary: "{{fields.vu}}"
                fields:
                  - { name: f, label: Image, widget: image,
                      hint: "PAGE D'ACCUEIL, en portrait, recadrée en 3/4. Si ce visuel a un reel, il passe en vidéo plus haut et sort de cette grille." }
                  - { name: vu, label: Ce qu'on voit, widget: string }
                  - { name: vu_en, label: Ce qu'on voit, en anglais, widget: string }

  # -------------------------------------------------------------------
  - name: publications
    label: ▶️  Les vidéos  ·  haut de l'accueil
    files:
      - name: reels
        label: Les vidéos qui jouent sur l'accueil
        file: donnees/publications.json
        description: >
          OÙ ÇA SORT : en haut de la page d'accueil, dans la rangée qui
          défile de gauche à droite. Les vidéos jouent SUR le site, le
          visiteur ne part pas sur Instagram.
          Pour en ajouter un : ouvrez la publication sur Instagram, copiez
          le lien, et gardez le code qui suit /reel/.
        fields:
          - name: reels
            label: Les reels
            label_singular: un reel
            widget: list
            summary: "{{fields.vu}}  ·  {{fields.code}}"
            fields:
              - { name: code, label: Code du reel, widget: string,
                  pattern: ['^[A-Za-z0-9_-]{6,20}$',
                            "C'est la suite de lettres après /reel/ dans l'adresse Instagram."],
                  hint: "Dans instagram.com/reel/DbIySQNChyT/ le code est DbIySQNChyT" }
              - { name: vu, label: Ce qu'on voit, widget: string }
              - { name: vu_en, label: Ce qu'on voit, en anglais, widget: string }
              - { name: apercu, label: Image de secours, widget: image,
                  hint: "S'affiche une seconde, le temps que la vidéo charge. Prenez la première image du reel." }

  # -------------------------------------------------------------------
  - name: clients
    label: 🏷  Logos clients  ·  bandeau noir, partout
    files:
      - name: clients
        label: Les logos qui défilent
        file: donnees/clients.json
        description: >
          OÙ ÇA SORT : dans le bandeau noir qui défile, présent sur les
          trois pages. C'est la preuve la plus regardée du site — mettez les
          plus connus en premier, ce sont eux qu'on voit en premier.
          Les logos sont affichés en blanc : un logo sombre sera invisible.
        fields:
          - name: logos
            label: Les logos
            label_singular: un logo
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: f, label: Logo, widget: image,
                  hint: "BANDEAU NOIR. Affiché en blanc : prenez une version claire sur fond transparent, sinon il sera invisible." }
              - { name: nom, label: Nom du client, widget: string }

  # -------------------------------------------------------------------
  - name: histoire
    label: ✍️  Mon histoire  ·  page Travailler ensemble
    files:
      - name: histoire
        label: Ce que je raconte de moi
        file: donnees/histoire.json
        description: >
          OÙ ÇA SORT : toute la page « Travailler ensemble », de haut en bas,
          dans l'ordre où les blocs apparaissent ci-dessous.
          Écrivez comme vous parlez : les phrases entre guillemets sont les
          vôtres, ce sont elles qui portent la page.
        fields:
          - { name: promesse, label: La promesse, widget: text }
          - { name: promesse_en, label: La promesse, en anglais, widget: text }
          - name: chapitres
            label: Les chapitres
            label_singular: un chapitre
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: titre_en, label: Titre en anglais, widget: string }
              - { name: texte, label: Paragraphes, widget: list, field: { name: p, label: Paragraphe, widget: text } }
              - { name: texte_en, label: Paragraphes en anglais, widget: list, field: { name: p, label: Paragraphe, widget: text } }
              - { name: citation, label: La phrase à retenir, widget: text }
              - { name: citation_en, label: La phrase à retenir, en anglais, widget: text }
          - name: formats
            label: Ce que je propose
            label_singular: un format
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: nom, label: Nom, widget: string }
              - { name: nom_en, label: Nom en anglais, widget: string }
              - { name: quoi, label: En quoi ça consiste, widget: text }
              - { name: quoi_en, label: En quoi ça consiste, en anglais, widget: text }
              - { name: pour, label: Pour qui, widget: string }
              - { name: pour_en, label: Pour qui, en anglais, widget: string }
          - { name: comment_titre, label: Titre de « comment ça se passe », widget: string }
          - { name: comment_titre_en, label: Le même en anglais, widget: string }
          - { name: comment_chapeau, label: Introduction, widget: text }
          - { name: comment_chapeau_en, label: Introduction en anglais, widget: text }
          - name: comment
            label: Les étapes
            label_singular: une étape
            widget: list
            summary: "{{fields.n}}. {{fields.t}}"
            fields:
              - { name: n, label: Numéro, widget: string }
              - { name: t, label: Titre, widget: string }
              - { name: t_en, label: Titre en anglais, widget: string }
              - { name: d, label: Description, widget: text }
              - { name: d_en, label: Description en anglais, widget: text }

  # -------------------------------------------------------------------
  - name: instagram
    label: 📈  Nombre d'abonnés  ·  badge en haut
    files:
      - name: instagram
        label: Le compteur
        file: donnees/instagram.json
        description: >
          OÙ ÇA SORT : dans le badge Instagram en haut à droite de chaque
          page, et dans le premier des trois chiffres de l'accueil.
          Une fois le compte relié, il se met à jour tout seul quatre fois
          par jour et cette rubrique devient inutile.
        fields:
          - { name: compte, label: Compte Instagram, widget: string }
          - { name: abonnes, label: Nombre d'abonnés, widget: number,
              value_type: int, min: 0 }
          - { name: releve, label: Date du relevé, widget: datetime,
              date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD",
              hint: "Le site affiche cette date à côté du chiffre. Un nombre sans date ne prouve rien." }
          - { name: source, label: Origine, widget: select,
              options: ["manuel", "api"], default: "manuel" }
